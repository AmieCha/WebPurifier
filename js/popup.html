<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WebPurifier</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      padding: 12px;
      margin: 0;
      color: #333;
      background-color: #f9f9f9;
    }

    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    h1 { font-size:20px; margin:0; font-weight:600; }
    section { margin-top:15px; padding:15px; border-radius:10px; background-color:#fff; box-shadow:0 1px 5px rgba(0,0,0,0.05); }
    h2 { font-size:15px; margin-bottom:10px; font-weight:500; color:#555; }
    .slider-container { display:flex; justify-content:space-between; padding:0 5px; font-size:13px; color:#777; margin-top:5px; }
    input[type="range"] { width:100%; height:6px; border-radius:3px; accent-color:#2196f3; margin-top:8px; }

    .topic-input-group { display:flex; margin-bottom:12px; }
    .topic-input-group input { flex-grow:1; border:1px solid #ccc; padding:8px; border-radius:5px; font-size:13px; }
    .topic-input-group button { margin-left:6px; background-color:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; padding:0 12px; font-size:13px; transition:background 0.2s; }
    .topic-input-group button:hover { background-color:#0056b3; }

    .topics button {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 6px 12px;
      margin-right:6px;
      margin-bottom:6px;
      cursor:pointer;
      font-size:13px;
      transition: all 0.2s;
      position: relative;
    }

    .topics button.active { transform: scale(1.05); background-color:#007bff; color:white; border-color:#007bff; }
    .topics button.custom.active { background-color:#0056b3; border-color:#0056b3; color:white; }
    .topics button span.delete-btn { margin-left:6px; color:#555; cursor:pointer; font-size:12px; }
    .topics button span.delete-btn:hover { color:#ff3b30; }

    .footer { display:flex; justify-content:space-between; margin-top:20px; }
    .footer button, .back-button { background-color:#fff; border:1px solid #ccc; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; transition:all 0.2s; }
    .footer button:hover, .back-button:hover { background-color:#f0f0f0; border-color:#999; }

    .switch { position:relative; display:inline-block; width:50px; height:28px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#ccc; transition:0.3s; border-radius:34px; }
    .slider:before { position:absolute; content:""; height:20px; width:20px; left:4px; bottom:4px; background-color:white; transition:0.3s; border-radius:50%; }
    input:checked + .slider { background-color:#2196f3; box-shadow:0 0 8px rgba(33,150,243,0.6); }
    input:checked + .slider:before { transform: translateX(22px); }

    #container.disabled { opacity:0.6; pointer-events:none; }
  </style>
</head>
<body>
  <div id="main-view">
    <div class="header">
      <h1>WebPurifier</h1>
      <label class="switch">
        <input type="checkbox" id="main-toggle" />
        <span class="slider round"></span>
      </label>
    </div>
    <div id="container">
      <section>
        <h2>필터링 강도</h2>
        <input type="range" id="strength-slider" min="1" max="3" step="1" value="2" />
        <div class="slider-container"><span>약함</span><span>보통</span><span>강함</span></div>
      </section>

      <section>
        <h2>민감주제 선택</h2>
        <div class="topic-input-group">
          <input type="text" id="custom-topic-input" placeholder="직접 주제 추가" />
          <button id="add-topic-button">추가</button>
        </div>
        <div class="topics">
          <!-- 기본 토픽 HTML -->
          <button>비속어</button>
          <button>외모</button>
          <button>학벌</button>
          <button>신체</button>
          <button>정치</button>
        </div>
      </section>

      <div class="footer">
        <button id="dashboard-button">📊 대시보드 보기</button>
        <button id="go-to-settings-button">⚙️ 상세 설정</button>
      </div>
    </div>
  </div>

  <div id="settings-view" style="display:none;">
    <div class="header">
      <button class="back-button">←</button>
      <h1 style="flex-grow:1; text-align:center;">상세 설정</h1>
      <div style="width:28px;"></div>
    </div>
    <section>
      <h2>대응 방식 설정</h2>
      <div><input type="radio" name="response-method" value="block" id="method-block" /><label for="method-block">자동 차단</label></div>
      <div><input type="radio" name="response-method" value="soften" id="method-soften" /><label for="method-soften">완화 표현</label></div>
      <div><input type="radio" name="response-method" value="warn" id="method-warn" /><label for="method-warn">경고 후 선택적 확인</label></div>
    </section>
  </div>

  <script src="popup.js" defer></script>
</body>
</html>
